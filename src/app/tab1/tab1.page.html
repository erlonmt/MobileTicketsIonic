<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cliente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <section class="status-strip">
    <div>
      <span>Expediente</span>
      <strong>{{ senhaService.statusExpediente }}</strong>
    </div>
    <div>
      <span>Horário</span>
      <strong>{{ senhaService.horarioAtual | date:'HH:mm' }}</strong>
    </div>
  </section>

  <ion-card class="ticket-card">
    <ion-card-header class="ion-text-center">
      <ion-icon name="ticket-outline" size="large" color="primary"></ion-icon>
      <ion-card-title>Emissão de Senha</ion-card-title>
      <ion-card-subtitle>Totem do cliente</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <div class="senha-box">
        <span class="senha-gerada">{{ senhaGerada?.codigo || '--' }}</span>
      </div>

      <ion-note color="medium">{{ mensagem }}</ion-note>

      <div class="button-stack">
        <ion-button expand="block" size="large" class="geral" [disabled]="!senhaService.expedienteAtivo" (click)="pegarSenha('SG')">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          Geral
        </ion-button>

        <ion-button expand="block" size="large" class="prioritaria" [disabled]="!senhaService.expedienteAtivo" (click)="pegarSenha('SP')">
          <ion-icon name="star-outline" slot="start"></ion-icon>
          Prioritária
        </ion-button>

        <ion-button expand="block" size="large" class="exame" [disabled]="!senhaService.expedienteAtivo" (click)="pegarSenha('SE')">
          <ion-icon name="flask-outline" slot="start"></ion-icon>
          Exame
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
